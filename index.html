    <!-- Meta Pixel + Google tag: window.fbq/window.gtag are defined
    synchronously below (near-zero cost, no network — just the queueing
    stubs both libraries ship with) so any code that fires an event early
    (QuotePage.jsx's generate_lead conversion) always has a safe function to
    call. The actual fbevents.js / gtag.js network fetches — the expensive
    part — are deferred to the window 'load' event so they stop competing
    with the hero for bandwidth/CPU during the LCP-critical render window.
    Previously both loaded eagerly here; homepage LCP measured 10-11s in the
    2026-09-11 SEO audit with ~470KB of this-plus-bundle blocking paint. -->
    <script>
    !function(f,b,e,v,n,t,s)
    {if(f.fbq)return;n=f.fbq=function(){n.callMethod?
    n.callMethod.apply(n,arguments):n.queue.push(arguments)};
    if(!f._fbq)f._fbq=n;n.push=n;n.loaded=!0;n.version='2.0';n.queue=[];
    window._loadFbPixelScript=function(){t=b.createElement(e);t.async=!0;t.src=v;
    s=b.getElementsByTagName(e)[0];s.parentNode.insertBefore(t,s)};
    }(window, document,'script','https://connect.facebook.net/en_US/fbevents.js');
    fbq('init', '1837240890079802');
    fbq('track', 'PageView');

    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    window.gtag = gtag;
    gtag('js', new Date());
    gtag('config', 'G-NB7YB5WJNN');
    gtag('config', 'AW-11471124120');

    function _loadDeferredTrackingScripts() {
      window._loadFbPixelScript();
      var gtagScript = document.createElement('script');
      gtagScript.async = true;
      gtagScript.src = 'https://www.googletagmanager.com/gtag/js?id=G-NB7YB5WJNN';
      document.head.appendChild(gtagScript);
    }
    if (document.readyState === 'complete') {
      _loadDeferredTrackingScripts();
    } else {
      window.addEventListener('load', _loadDeferredTrackingScripts);
    }
    </script>

    <!-- Preload critical fonts to prevent layout shifts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="preconnect" href="https://www.googletagmanager.com">
    <link rel="preload" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" as="style" onload="this.onload=null;this.rel='stylesheet'">
    <noscript><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet"></noscript>

    <!-- Preload Material Icons to prevent layout shifts -->
    <link rel="preload" href="https://fonts.googleapis.com/icon?family=Material+Icons" as="style" onload="this.onload=null;this.rel='stylesheet'">
    <noscript><link rel="stylesheet" href="https://fonts.googleapis.com/icon?family=Material+Icons"></noscript>
    
    <title>Gem City Cleaning Crew</title>
    
    <!-- Prevent layout shifts with critical CSS -->
    <style>
      /* Prevent layout shifts during font loading */
      * {
        font-display: swap;
      }
      
      /* Reserve space for logo to prevent shifts */
      .logo-container {
        min-height: 48px;
        min-width: 48px;
      }
      
      /* Prevent header height shifts */
      .MuiAppBar-root {
        min-height: 64px;
      }
      
      /* Reserve space for main content */
      .main-content {
        min-height: 100vh;
      }
      
      /* Prevent rating component shifts */
      .MuiRating-root {
        min-height: 24px;
      }
      
      /* Prevent button shifts */
      .MuiButton-root {
        min-height: 36px;
      }
      
      /* Prevent Typography shifts */
      .MuiTypography-root {
        font-family: 'Inter', 'Roboto', 'Helvetica', 'Arial', sans-serif;
      }
      
      /* Prevent Card shifts */
      .MuiCard-root {
        min-height: 100px;
      }
      
      /* Prevent chip layout shifts */
      .MuiChip-root {
        min-height: 32px;
      }
      
      /* Ensure consistent line heights */
      body {
        font-family: 'Inter', 'Roboto', 'Helvetica', 'Arial', sans-serif;
        line-height: 1.5;
      }
    </style>
